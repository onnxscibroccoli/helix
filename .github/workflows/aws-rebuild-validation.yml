name: AWS rebuild validation

on:
  push:
    paths:
      - "infra/aws/**"
      - "production/desktop/**"
      - ".github/workflows/aws-rebuild-validation.yml"
  pull_request:
    paths:
      - "infra/aws/**"
      - "production/desktop/**"
      - ".github/workflows/aws-rebuild-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - name: Terraform format
        working-directory: infra/aws
        run: terraform fmt -check -recursive
      - name: Terraform init
        working-directory: infra/aws
        run: terraform init -backend=false
      - name: Terraform validate
        working-directory: infra/aws
        run: terraform validate
      - name: Shell syntax
        run: |
          bash -n infra/aws/user-data.sh
          bash -n production/desktop/helix-kvm-bootstrap.sh
          bash -n production/desktop/helix-rdc-bootstrap.sh
