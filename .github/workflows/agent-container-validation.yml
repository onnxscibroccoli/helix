name: agent-container-validation

on:
  pull_request:
    paths:
      - "infra/agents/**"
      - "infra/ansible/converge-agents.yml"
      - "infra/ansible/converge-agent-container.yml"
      - ".github/workflows/agent-container-validation.yml"
  push:
    branches: [main]
    paths:
      - "infra/agents/**"
      - "infra/ansible/converge-agents.yml"
      - "infra/ansible/converge-agent-container.yml"
      - ".github/workflows/agent-container-validation.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the commit under test without a third-party action
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          GIT_CONFIG_COUNT: "1"
          GIT_CONFIG_KEY_0: http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0: AUTHORIZATION: bearer ${{ github.token }}
        run: |
          set -euo pipefail
          git init --quiet repo
          git -C repo remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then
            git -C repo fetch --depth=1 origin "refs/pull/${PR_NUMBER}/merge"
          else
            git -C repo fetch --depth=1 origin "${GITHUB_SHA}"
          fi
          git -C repo checkout --detach FETCH_HEAD
          echo "checked_out=$(git -C repo rev-parse HEAD) event=${GITHUB_EVENT_NAME} requested=${GITHUB_SHA}"

      - name: Build container
        working-directory: repo
        run: docker build --pull --tag omnikali-coding-agent:ci infra/agents

      - name: Run non-root smoke tests
        working-directory: repo
        run: |
          docker run --rm --read-only --tmpfs /tmp:rw,noexec,nosuid,nodev \
            --security-opt no-new-privileges \
            --cap-drop ALL \
            --user 1000:1000 \
            omnikali-coding-agent:ci \
            -lc 'id -u; claude --version; openhands --version; gh --version'
