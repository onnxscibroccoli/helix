name: validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  proofs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: pip install pytest pyyaml
      - name: Run validation harness
        run: pytest test-suite/tests -q
        env:
          HELIX_SKIP_LIVE: "1"
