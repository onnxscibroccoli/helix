name: claude-self-correct

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this parallel co-dev run started"
        required: false
        default: "manual"
        type: string
  workflow_run:
    workflows: ["production-validation"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@v4

      - name: Claude source repair
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          additional_permissions: |
            actions: read
          prompt: |
            Read CLAUDE.md and AGENTS.md only if present. Do not ingest .grok/.
            Reason: ${{ inputs.reason || github.event.workflow_run.conclusion || 'dispatch' }}.
            Diagnose from CI evidence plus the single failing file.
            Fix only that defect. Do not weaken tests or safety gates.
            Do not deploy to AWS. Do not request production credentials.
            Leave a reviewable branch. Do not merge main.
          claude_args: |
            --max-turns 8
            --allowedTools "Read,Edit,Write,Bash(git status),Bash(git diff),Bash(npm ci),Bash(npm test),Bash(npm run test:production-gateway),Bash(terraform -chdir=infra/terraform fmt -check),Bash(terraform -chdir=infra/terraform validate)"
