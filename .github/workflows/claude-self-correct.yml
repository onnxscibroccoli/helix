name: claude-self-correct

on:
  workflow_run:
    workflows: ["production-validation"]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read
  id-token: write

jobs:
  repair:
    if: github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout trusted main
        uses: actions/checkout@fd1c128679612beff4ca259c78021c506e8aa7a7

      - name: Claude source repair
        uses: anthropics/claude-code-action@fd1c128679612beff4ca259c78021c506e8aa7a7
        with:
          anthropic_federation_rule_id: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
          anthropic_organization_id: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
          anthropic_service_account_id: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
          additional_permissions: |
            actions: read
          prompt: |
            Read CLAUDE.md and AGENTS.md only. Do not ingest .grok/ or the whole repo.
            A trusted main-branch production-validation run failed.
            Diagnose from CI logs plus the single failing source file.
            Fix only that defect. Do not weaken tests or safety gates.
            Do not deploy to AWS. Do not request production credentials.
            Leave a reviewable branch. Do not merge main.
          claude_args: |
            --max-turns 8
            --allowedTools "Read,Edit,Write,Bash(git status),Bash(git diff),Bash(npm ci),Bash(npm test),Bash(npm run test:production-gateway),Bash(terraform -chdir=infra/terraform fmt -check),Bash(terraform -chdir=infra/terraform validate)"
