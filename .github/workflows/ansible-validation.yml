name: ansible-validation
on:
  pull_request:
    paths:
      - "infra/ansible/**"
      - ".github/workflows/ansible-validation.yml"
  push:
    branches: [main]
    paths:
      - "infra/ansible/**"
      - ".github/workflows/ansible-validation.yml"
permissions:
  contents: read
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check "ansible-core>=2.17,<2.19"
      - run: ansible-galaxy collection install -r infra/ansible/requirements.yml
      - run: ansible-playbook -i localhost, --syntax-check infra/ansible/converge-hypervisor.yml
      - run: |
          python - <<'PY'
          import yaml
          for path in ["infra/ansible/inventory.aws_ec2.yml", "infra/ansible/requirements.yml"]:
              with open(path, encoding="utf-8") as f:
                  yaml.safe_load(f)
          print("ansible yaml parse: PASS")
          PY
