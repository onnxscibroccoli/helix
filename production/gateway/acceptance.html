<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OmniKali Production Acceptance</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#07090d;color:#eef2f7;font:15px system-ui,-apple-system,sans-serif;padding:20px}
main{max-width:760px;margin:auto;padding:24px;border:1px solid #263242;border-radius:20px;background:#0b1018}
h1{margin:0 0 8px}.muted{color:#91a0b2}.row{display:flex;justify-content:space-between;border-bottom:1px solid #202a37;padding:12px 0;gap:12px}.ok{color:#8fe2b3}.warn{color:#f0c674}.bad{color:#ff8b8b}button{margin-top:18px;width:100%;padding:14px;border:0;border-radius:12px;background:#bde8ff;color:#071018;font-weight:800;font:inherit}pre{white-space:pre-wrap;word-break:break-word;background:#06090e;padding:14px;border-radius:12px;overflow:auto}
</style>
</head>
<body><main>
<h1>OmniKali Production Acceptance</h1>
<p class="muted">This page uses your existing Helix browser session. It never reads or exposes your session cookie.</p>
<div id="status"></div>
<button id="run">Run authenticated production acceptance</button>
<pre id="log"></pre>
<script>
const statusEl=document.getElementById("status"),log=document.getElementById("log"),run=document.getElementById("run");
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const uuid=()=>crypto.randomUUID();
function line(x){log.textContent+=x+"\n";log.scrollTop=log.scrollHeight}
function show(k,v,c=""){return '<div class="row"><span>'+k+'</span><strong class="'+c+'">'+v+'</strong></div>'}
async function j(url,opts={}){const r=await fetch(url,{...opts,credentials:"include",headers:{"content-type":"application/json",...(opts.headers||{})}});const b=await r.json().catch(()=>({}));if(!r.ok)throw new Error((b&&b.error)||("HTTP "+r.status));return b}
async function check(){
 try{const ws=await j("/api/v1/workspaces");const mine=ws.workspaces.find(x=>x.id==="omnikali");statusEl.innerHTML=show("Authentication","authenticated","ok")+show("Workspace","omnikali","ok")+show("Ownership",mine?"verified":"not found",mine?"ok":"bad");return Boolean(mine)}
 catch(e){statusEl.innerHTML=show("Authentication","not authenticated","bad");return false}
}
async function accept(){
 run.disabled=true;log.textContent="";
 try{
  if(!await check()) throw new Error("Sign in first, then reload this page.");
  const taskId=uuid(), idem="acceptance-"+taskId;
  line("POST /api/v1/tasks");
  const created=await j("/api/v1/tasks",{method:"POST",body:JSON.stringify({
    task_id:taskId,target:"kali",workspace_id:"omnikali",idempotency_key:idem,
    payload:{command:"printf 'OMNIKALI_ACCEPTANCE_OK\\n'",timeout_seconds:30}
  })});
  line("Accepted: "+created.task_id+" state="+created.state);
  const seen=[];
  const deadline=Date.now()+90000;
  while(Date.now()<deadline){
    const t=await j("/api/v1/acceptance/tasks/"+encodeURIComponent(taskId));
    if(t.state && !seen.includes(t.state)){seen.push(t.state);line("STATE: "+t.state)}
    if(t.state==="COMPLETED"){
      const good=JSON.stringify(t.result||{}).includes("OMNIKALI_ACCEPTANCE_OK");
      line("Kali result marker: "+(good?"verified":"not found"));
      line("Events: "+(t.events||[]).map(e=>e.to_state).join(" -> "));
      statusEl.innerHTML=show("Acceptance","COMPLETED","ok")+show("Lifecycle",seen.join(" → "),seen.includes("PENDING")&&seen.includes("RUNNING")?"ok":"warn")+show("Kali execution",good?"verified":"unexpected result",good?"ok":"bad");
      return;
    }
    if(t.state==="FAILED") throw new Error("Task failed; inspect server-side task events.");
    await sleep(1000);
  }
  throw new Error("Timed out waiting for COMPLETED; task remains server-side for inspection.");
 }catch(e){statusEl.innerHTML=show("Acceptance","FAILED","bad");line("ERROR: "+e.message)}
 finally{run.disabled=false}
}
check();run.onclick=accept;
</script>
</main></body></html>
