name: Production runtime validation

on:
  pull_request:
  workflow_dispatch:

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check production/gateway/state/task-policy.mjs
      - run: node --check production/gateway/state/task-state.mjs
      - run: node --check production/gateway/state/task-runner.mjs
      - run: node --check production/gateway/state/agent-executor.mjs
      - run: node --check production/agent/omni-agent.mjs
      - run: node --test production/gateway/state/task-policy.test.mjs production/gateway/state/task-state.test.mjs production/gateway/state/task-runner.test.mjs production/gateway/state/agent-executor.test.mjs production/gateway/state/task-dispatch.test.mjs
      - run: bash -n infra/aws/user-data.sh
